<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b2118">
    <title>책 100권</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="home">
        <header class="home-header">
            <p class="eyebrow">MY READING LIST</p>
            <h1><span class="nowrap">죽기 전에</span> <span class="nowrap">읽어야 할</span><br><span class="accent">책 100권</span></h1>
            <p class="lead">동서양의 문학, 철학, 역사, 과학 고전을 한 권씩 읽어 나가는 나만의 독서 여정</p>
        </header>

        <section class="progress-card">
            <div class="progress-numbers">
                <span class="count">0</span>
                <span class="total">/ 100권</span>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <p class="progress-label">아직 읽은 책이 없어요. 첫 번째 책을 골라 보세요.</p>
        </section>

        <button class="start-button" type="button">시작하기</button>
    </main>
</body>
</html>
