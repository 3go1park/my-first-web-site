<!DOCTYPE html>
<html lang="ko">
<head>

            <h1>책읽는 삶의 재미</h1>
            <p id="book-summary" class="lead"></p>

        <p id="flash" class="message success" hidden></p>

        <div class="home-groups">
            <section class="menu-group">
                <h2 class="group-title">책 목록</h2>
                <div class="menu-grid">
                    <a class="menu-tile" href="list.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>

                </div>
            </section>

            <section class="menu-group">
                <h2 class="group-title">관리</h2>
                <div class="menu-grid">
                    <a id="backup-tile" class="menu-tile" href="backup.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1ZM8 4v5h7V4M8 20v-6h8v6"/></svg>

                </div>
            </section>

            <section class="menu-group menu-group-wide">
                <h2 class="group-title">책 읽기</h2>
                <div class="menu-grid">
                    <a class="menu-tile" href="reading.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5a1 1 0 0 1 1-1h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H3a1 1 0 0 1-1-1ZM22 5a1 1 0 0 0-1-1h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7a1 1 0 0 0 1-1Z"/></svg>

    <script src="common.js?v=6"></script>
    <script src="app.js?v=6"></script>
    <script src="register-sw.js?v=6"></script>
