<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b2118">
    <title>책 목록 - 책읽는 삶의 재미</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <main class="page page-wide">
        <a class="back-link" href="index.html">← 홈으로</a>

        <header class="page-header">
            <p class="eyebrow">책 목록</p>
            <h2>책 목록 <span id="book-count" class="book-count"></span></h2>
        </header>

        <p id="flash" class="message success" hidden></p>

        <section id="empty" class="card" hidden>
            <p class="hint">아직 등록된 책이 없어요. 책 목록을 업로드하거나 직접 등록해 주세요.</p>
            <div class="button-row">
                <a class="secondary-button" href="upload.html">책 목록 업로드</a>
                <a class="secondary-button" href="register.html">책 등록</a>
            </div>
        </section>

        <section id="book-list" class="book-list" hidden>
            <div class="book-row book-row-head">
                <span>번호</span>
                <span>제목</span>
                <span class="col-author">저자</span>
                <span>장르</span>
                <span class="col-country">국가</span>
                <span class="col-year">출간</span>
            </div>
            <ol id="book-rows"></ol>
        </section>
    </main>
    <script src="common.js?v=7"></script>
    <script src="list.js?v=7"></script>
    <script src="register-sw.js?v=7"></script>
</body>
</html>
